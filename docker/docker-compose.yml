services:
  java-server:
    container_name: gym-java-server
    build:
      context: ../java-server
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE:
      POSTGRES_DB:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DISCOVERY_SERVER_URL: ${DISCOVERY_SERVER_URL}
    networks:
      - gym-network
    depends_on:
      discovery-server:
        condition: service_healthy

  discovery-server:
    container_name: gym-discovery-server
    build:
      context: ../discovery-server
      dockerfile: docker/Dockerfile
    ports:
      - "8761:8761"
    networks:
      - gym-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  gym-network:
    external: true
    name: gym-network
