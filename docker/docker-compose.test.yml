services:
  java-server-test:
    container_name: gym-java-server-test
    build:
      context: ../java-server
      dockerfile: docker/test.Dockerfile
    environment:
      SONAR_LOGIN: ${SONAR_LOGIN}
      SONAR_PASSWORD: ${SONAR_PASSWORD}
      SONAR_PROJECT_KEY: gym-java-server
      SONAR_PROJECT_NAME: "Gym Java Server"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    networks:
      - gym-network
    volumes:
      - maven-repo:/root/.m2/repository

networks:
  gym-network:
    external: true
    name: gym-network

volumes:
  maven-repo:
