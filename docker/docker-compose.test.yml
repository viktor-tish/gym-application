services:
  java-server-test:
    container_name: gym-java-server-test
    build:
      context: ../java-server
      dockerfile: docker/test.Dockerfile
    environment:
      SONAR_PROJECT_KEY: gym-java-server
    networks:
      - gym-network
    volumes:
      - maven-repo:/root/.m2/repository
      - sonarqube-context:/tmp/sonarqube-context:ro

  workload-report-server-test:
    container_name: gym-workload-report-server-test
    build:
      context: ../workload-report-server
      dockerfile: docker/test.Dockerfile
    environment:
      SONAR_PROJECT_KEY: gym-workload-report-server
    networks:
      - gym-network
    volumes:
      - maven-repo:/root/.m2/repository
      - sonarqube-context:/tmp/sonarqube-context:ro

  discovery-server-test:
    container_name: gym-discovery-server-test
    build:
      context: ../discovery-server
      dockerfile: docker/test.Dockerfile
    environment:
      SONAR_PROJECT_KEY: gym-discovery-server
    networks:
      - gym-network
    volumes:
      - maven-repo:/root/.m2/repository
      - sonarqube-context:/tmp/sonarqube-context:ro

networks:
  gym-network:
    external: true
    name: gym-network

volumes:
  maven-repo:
  sonarqube-context:
    external: true
    name: sonarqube-context
