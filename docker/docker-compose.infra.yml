services:
  db:
    container_name: gym-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql:ro
    networks:
      - gym-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: gym-pgadmin
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gym-network

  sonarqube:
    container_name: gym-sonarqube
    image: sonarqube:community
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-extensions:/opt/sonarqube/extensions
    restart: unless-stopped
    networks:
      - gym-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"'" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  sonarqube-init:
    container_name: gym-sonarqube-init
    image: curlimages/curl:latest
    user: "0:0"
    environment:
      SONAR_LOGIN: ${SONAR_LOGIN}
      SONAR_PASSWORD: ${SONAR_PASSWORD}
    volumes:
      - ./init-sonar.sh:/tmp/init-sonar.sh
      - sonarqube-context:/tmp/sonarqube-context
    networks:
      - gym-network
    depends_on:
      sonarqube:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "/tmp/init-sonar.sh" ]

networks:
  gym-network:
    name: gym-network

volumes:
  postgres-data:
  pgadmin-data:
  sonarqube-data:
  sonarqube-logs:
  sonarqube-extensions:
  sonarqube-context:
    name: sonarqube-context
