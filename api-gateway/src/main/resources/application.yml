spring:
  application:
    name: gym-api-gateway
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: gym-workload-report
              uri: lb://gym-workload-report
              order: 0
              predicates:
                - Path=/api/v1/trainers/{username}/workload
            - id: gym-application
              uri: lb://gym-application
              order: 1
              predicates:
                - Path=/api/v1/trainers/**, /api/v1/trainees/**, /api/v1/trainings/**, /api/v1/auth/**

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

server:
  port: 8000

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVER_URL}
    fetch-registry: true
  instance:
    prefer-ip-address: true
