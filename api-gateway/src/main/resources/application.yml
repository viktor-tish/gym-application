spring:
  application:
    name: api-gateway

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

server:
  port: 8000

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVER_URL}
    fetch-registry: true
  instance:
    prefer-ip-address: true
