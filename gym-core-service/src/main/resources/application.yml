spring:
  application:
    name: gym-core-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 5s
  artemis:
    mode: native
    broker-url: ${ACTIVEMQ_URL}
    user: ${ACTIVEMQ_USER}
    password: ${ACTIVEMQ_PASSWORD}
  jms:
    template:
      qos-enabled: true
      delivery-mode: persistent
      observation-enabled: true

management:
  health:
    memory:
      free-threshold-mb: 10
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVER_URL}
  instance:
    prefer-ip-address: true

resilience4j:
  circuitbreaker:
    instances:
      trainerWorkloadClient:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50

app:
  trainer-workload:
    transport: jms
    queue: gym.trainer-workload.updates
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION_MS}
    internal-jwt:
      secret: ${INTERNAL_JWT_SECRET}
      expiration-ms: ${INTERNAL_JWT_EXPIRATION_MS}
    login-attempt:
      max-attempts: 3
      ban-duration: 20s
