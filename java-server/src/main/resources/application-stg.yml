spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/gym_application_stg
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000

  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/testdata
