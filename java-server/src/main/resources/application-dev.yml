spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/gym_application_dev
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    locations:
      - classpath:db/migration
      - classpath:db/testdata

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}
