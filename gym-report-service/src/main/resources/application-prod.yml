spring:
  datasource:
    url: jdbc:h2:mem:report;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: ${H2_WORKLOAD_REPORT_DB_USERNAME}
    password: ${H2_WORKLOAD_REPORT_DB_PASSWORD}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false
  artemis:
    pool:
      enabled: true
      max-connections: 20
  jms:
    listener:
      min-concurrency: 4
      max-concurrency: 16

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.vttish.gymapplication: INFO
    org.springframework.jms.listener: INFO
