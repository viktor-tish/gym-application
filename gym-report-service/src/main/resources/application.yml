spring:
  application:
    name: gym-report-service
  datasource:
    url: jdbc:h2:mem:report;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  artemis:
    mode: native
    broker-url: ${ACTIVEMQ_URL}
    user: ${ACTIVEMQ_USER}
    password: ${ACTIVEMQ_PASSWORD}
    pool:
      enabled: false
  jms:
    listener:
      min-concurrency: 1
      max-concurrency: 2
      session:
        transacted: true
      observation-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${DISCOVERY_SERVER_URL}
  instance:
    prefer-ip-address: true

app:
  trainer-workload:
    queue: gym.trainer-workload.updates
    dlq: DLQ
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    internal-jwt:
      secret: ${INTERNAL_JWT_SECRET}
      expiration-ms: ${INTERNAL_JWT_EXPIRATION_MS}

logging:
  level:
    org.vttish.gymapplication: DEBUG
    org.springframework.jms.listener: DEBUG
